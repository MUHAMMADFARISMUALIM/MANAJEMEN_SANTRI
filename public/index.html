<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Manajemen Asrama Pesantren</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="row g-0">
            <!-- Left Side - Info -->
            <div class="col-md-6 login-left">
                <div class="login-brand">
                    <img src="logo-aziziyyah.png" alt="Logo MA Aziziyyah" class="login-logo">
                    <h2>Sistem Manajemen Asrama</h2>
                    <p>MA Aziziyyah</p>
                </div>
                <div class="login-features">
                    <div class="feature-item">
                        <i class="fas fa-users"></i>
                        <div>
                            <h5>Manajemen Santri</h5>
                            <p>Kelola data santri dengan mudah</p>
                        </div>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-file-alt"></i>
                        <div>
                            <h5>Perizinan Digital</h5>
                            <p>Sistem perizinan yang terorganisir</p>
                        </div>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-clipboard-check"></i>
                        <div>
                            <h5>Pelanggaran & Pembinaan</h5>
                            <p>Monitoring dan pembinaan santri</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Side - Login Form -->
            <div class="col-md-6 login-right">
                <div class="login-form-wrapper">
                    <h3 class="text-center mb-4">Selamat Datang</h3>
                    <p class="text-center text-muted mb-4">Silakan login untuk melanjutkan</p>

                    <div id="alertBox"></div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                                <input type="text" class="form-control" id="username" placeholder="Masukkan username" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control" id="password" placeholder="Masukkan password" required>
                                <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mb-3" id="loginBtn">
                            <i class="fas fa-sign-in-alt me-2"></i>Login
                        </button>
                    </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
