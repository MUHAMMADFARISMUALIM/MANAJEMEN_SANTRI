<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembinaan - Sistem Manajemen Asrama</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="sidebar"></div>

    <div class="main-content">
        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
            <div class="container-fluid">
                <button class="btn btn-link" id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <h5 class="mb-0">Pembinaan Santri</h5>
                <div class="ms-auto">
                    <div class="dropdown">
                        <button class="btn btn-link dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="fas fa-user-circle fa-lg"></i>
                            <span id="userNameNav">User</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" id="logoutBtn"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>

        <div class="container-fluid p-4">
            <div id="alertContainer"></div>

            <!-- Stats -->
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <div class="card bg-primary text-white">
                        <div class="card-body text-center">
                            <h3 id="statProses">0</h3>
                            <p class="mb-0">Dalam Proses</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card bg-success text-white">
                        <div class="card-body text-center">
                            <h3 id="statSelesai">0</h3>
                            <p class="mb-0">Selesai</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Filter & Action -->
            <div class="filter-section">
                <div class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label">Status</label>
                        <select class="form-select" id="filterStatus">
                            <option value="">Semua</option>
                            <option value="proses">Proses</option>
                            <option value="selesai">Selesai</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Jenis Pembinaan</label>
                        <select class="form-select" id="filterJenis">
                            <option value="">Semua</option>
                            <option value="teguran_lisan">Teguran Lisan</option>
                            <option value="teguran_tertulis">Teguran Tertulis</option>
                            <option value="konseling">Konseling</option>
                            <option value="sanksi_ringan">Sanksi Ringan</option>
                            <option value="sanksi_berat">Sanksi Berat</option>
                            <option value="pemanggilan_wali">Pemanggilan Wali</option>
                        </select>
                    </div>
                    <div class="col-md-auto ms-auto">
                        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalPembinaan">
                            <i class="fas fa-plus me-2"></i>Tambah Pembinaan
                        </button>
                    </div>
                </div>
            </div>

            <!-- Table -->
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Tanggal</th>
                                    <th>Santri</th>
                                    <th>Pelanggaran</th>
                                    <th>Jenis Pembinaan</th>
                                    <th>Pembina</th>
                                    <th>Status</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tablePembinaan">
                                <tr>
                                    <td colspan="7" class="text-center text-muted">Tidak ada data pembinaan</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Pembinaan -->
    <div class="modal fade" id="modalPembinaan" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Tambah Pembinaan</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formPembinaan">
                        <input type="hidden" id="pembinaaanId" value="">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Santri <span class="text-danger">*</span></label>
                                <select class="form-select" id="santri_id" required>
                                    <option value="">Pilih Santri</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Pelanggaran <span class="text-danger">*</span></label>
                                <select class="form-select" id="pelanggaran_id" required>
                                    <option value="">Pilih Pelanggaran</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Tanggal Pembinaan <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" id="tanggal_pembinaan" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Jenis Pembinaan <span class="text-danger">*</span></label>
                                <select class="form-select" id="jenis_pembinaan" required>
                                    <option value="">Pilih</option>
                                    <option value="teguran_lisan">Teguran Lisan</option>
                                    <option value="teguran_tertulis">Teguran Tertulis</option>
                                    <option value="konseling">Konseling</option>
                                    <option value="sanksi_ringan">Sanksi Ringan</option>
                                    <option value="sanksi_berat">Sanksi Berat</option>
                                    <option value="pemanggilan_wali">Pemanggilan Wali</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Hasil Pembinaan</label>
                                <textarea class="form-control" id="hasil_pembinaan" rows="2"></textarea>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-primary" id="btnSave">
                        <i class="fas fa-save me-2"></i><span id="btnSaveText">Simpan</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Detail Pembinaan -->
    <div class="modal fade" id="modalDetailPembinaan" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Detail Pembinaan</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">NIS</label>
                            <p id="detailNisPemb" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Nama Santri</label>
                            <p id="detailNamaSantriPemb" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Jenis Kelamin</label>
                            <p id="detailJKPemb" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Asrama</label>
                            <p id="detailAsramaPemb" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Kamar</label>
                            <p id="detailKamarPemb" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Status</label>
                            <p id="detailStatusSantriPemb" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-12">
                            <hr>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Pelanggaran</label>
                            <p id="detailNamaPelanggaranPemb" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Kategori</label>
                            <p id="detailKategoriPemb" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Jenis Pembinaan</label>
                            <p id="detailJenisPembinaan" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Tanggal Pembinaan</label>
                            <p id="detailTanggalPembinaan" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Pembina</label>
                            <p id="detailPembina" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Status Pembinaan</label>
                            <p id="detailStatusPembinaan" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">Hasil Pembinaan</label>
                            <p id="detailHasilPembinaan" class="form-control-plaintext">-</p>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/pembinaan.js"></script>
</body>
</html>
