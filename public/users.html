<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen User - Sistem Manajemen Asrama</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="sidebar"></div>

    <div class="main-content">
        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
            <div class="container-fluid">
                <button class="btn btn-link" id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <h5 class="mb-0">Manajemen User</h5>
                <div class="ms-auto">
                    <div class="dropdown">
                        <button class="btn btn-link dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="fas fa-user-circle fa-lg"></i>
                            <span id="userNameNav">User</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" id="logoutBtn"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>

        <div class="container-fluid p-4">
            <div id="alertContainer"></div>

            <!-- Filter & Action -->
            <div class="filter-section">
                <div class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label">Role</label>
                        <select class="form-select" id="filterRole">
                            <option value="">Semua</option>
                            <option value="admin">Admin</option>
                            <option value="pengasuh">Pengasuh</option>
                            <option value="ustadz">Ustadz</option>
                            <option value="ustadzah">Ustadzah</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Status</label>
                        <select class="form-select" id="filterStatus">
                            <option value="">Semua</option>
                            <option value="aktif">Aktif</option>
                            <option value="nonaktif">Non-aktif</option>
                        </select>
                    </div>
                    <div class="col-md-auto ms-auto">
                        <button class="btn btn-primary" id="addUserButton" data-bs-toggle="modal" data-bs-target="#modalUser">
                            <i class="fas fa-plus me-2"></i>Tambah User
                        </button>
                    </div>
                </div>
            </div>

            <!-- Table -->
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Username</th>
                                    <th>Nama Lengkap</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>JK</th>
                                    <th>No. HP</th>
                                    <th>Status</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tableUsers">
                                <tr>
                                    <td colspan="8" class="text-center text-muted">Tidak ada data user</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal User -->
    <div class="modal fade" id="modalUser" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Tambah User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formUser">
                        <input type="hidden" id="userId">
                        <div class="mb-3">
                            <label class="form-label">Username <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="username" required>
                        </div>
                        <div class="mb-3" id="passwordField">
                            <label class="form-label">Password <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="password" required>
                            <small class="text-muted">Minimal 6 karakter</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nama Lengkap <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="nama_lengkap" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="email">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Role <span class="text-danger">*</span></label>
                            <select class="form-select" id="role" required>
                                <option value="">Pilih Role</option>
                                <option value="admin">Admin</option>
                                <option value="pengasuh">Pengasuh Pesantren</option>
                                <option value="ustadz">Ustadz</option>
                                <option value="ustadzah">Ustadzah</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Jenis Kelamin <span class="text-danger">*</span></label>
                            <select class="form-select" id="jenis_kelamin" required>
                                <option value="">Pilih</option>
                                <option value="L">Laki-laki</option>
                                <option value="P">Perempuan</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">No. HP</label>
                            <input type="text" class="form-control" id="no_hp">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" id="status">
                                <option value="aktif">Aktif</option>
                                <option value="nonaktif">Non-aktif</option>
                            </select>
                        </div>
                        <fieldset class="mb-3">
                            <legend class="form-label">Akses Menu</legend>
                            <div class="border rounded p-3" id="menuAccessList">
                                <div class="form-check" data-menu-option="dashboard">
                                    <input class="form-check-input" type="checkbox" name="akses_menu" value="dashboard" id="akses_dashboard">
                                    <label class="form-check-label" for="akses_dashboard">Dashboard</label>
                                </div>
                                <div class="form-check" data-menu-option="santri">
                                    <input class="form-check-input" type="checkbox" name="akses_menu" value="santri" id="akses_santri">
                                    <label class="form-check-label" for="akses_santri">Data Santri</label>
                                </div>
                                <div class="form-check" data-menu-option="perizinan">
                                    <input class="form-check-input" type="checkbox" name="akses_menu" value="perizinan" id="akses_perizinan">
                                    <label class="form-check-label" for="akses_perizinan">Perizinan</label>
                                </div>
                                <div class="form-check" data-menu-option="pelanggaran">
                                    <input class="form-check-input" type="checkbox" name="akses_menu" value="pelanggaran" id="akses_pelanggaran">
                                    <label class="form-check-label" for="akses_pelanggaran">Pelanggaran</label>
                                </div>
                                <div class="form-check" data-menu-option="pembinaan">
                                    <input class="form-check-input" type="checkbox" name="akses_menu" value="pembinaan" id="akses_pembinaan">
                                    <label class="form-check-label" for="akses_pembinaan">Pembinaan</label>
                                </div>
                                <div class="form-check" data-menu-option="manajemen-asrama">
                                    <input class="form-check-input" type="checkbox" name="akses_menu" value="manajemen-asrama" id="akses_manajemen_asrama">
                                    <label class="form-check-label" for="akses_manajemen_asrama">Manajemen Asrama</label>
                                </div>
                                <div class="form-check" data-menu-option="users">
                                    <input class="form-check-input" type="checkbox" name="akses_menu" value="users" id="akses_users">
                                    <label class="form-check-label" for="akses_users">Manajemen User</label>
                                </div>
                            </div>
                            <small class="text-muted">Semua menu dapat dipilih. Perubahan berlaku setelah user login kembali.</small>
                        </fieldset>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-primary" id="btnSave">
                        <i class="fas fa-save me-2"></i>Simpan
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/users.js"></script>
</body>
</html>
