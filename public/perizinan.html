<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perizinan - Sistem Manajemen Asrama</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="sidebar"></div>

    <div class="main-content">
        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
            <div class="container-fluid">
                <button class="btn btn-link" id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <h5 class="mb-0">Perizinan Santri</h5>
                <div class="ms-auto">
                    <div class="dropdown">
                        <button class="btn btn-link dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="fas fa-user-circle fa-lg"></i>
                            <span id="userNameNav">User</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" id="logoutBtn"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>

        <div class="container-fluid p-4">
            <div id="alertContainer"></div>

            <!-- Stats -->
            <div class="row g-3 mb-4">
                <div class="col-4 col-md-4">
                    <div class="card bg-warning text-white">
                        <div class="card-body text-center">
                            <h3 id="statPending">0</h3>
                            <p class="mb-0">Pending</p>
                        </div>
                    </div>
                </div>
                <div class="col-4 col-md-4">
                    <div class="card bg-success text-white">
                        <div class="card-body text-center">
                            <h3 id="statDisetujui">0</h3>
                            <p class="mb-0">Disetujui</p>
                        </div>
                    </div>
                </div>
                <div class="col-4 col-md-4">
                    <div class="card bg-danger text-white">
                        <div class="card-body text-center">
                            <h3 id="statDitolak">0</h3>
                            <p class="mb-0">Ditolak</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Filter & Action -->
            <div class="filter-section">
                <div class="row g-3 align-items-end">
                    <div class="col-md-2">
                        <label class="form-label">Status</label>
                        <select class="form-select" id="filterStatus">
                            <option value="">Semua</option>
                            <option value="pending">Pending</option>
                            <option value="disetujui">Disetujui</option>
                            <option value="ditolak">Ditolak</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Tanggal Dari</label>
                        <input type="date" class="form-control" id="filterTanggalDari">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Tanggal Sampai</label>
                        <input type="date" class="form-control" id="filterTanggalSampai">
                    </div>
                    <div class="col-md-auto ms-auto">
                        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalPerizinan">
                            <i class="fas fa-plus me-2"></i>Ajukan Perizinan
                        </button>
                    </div>
                </div>
            </div>

            <!-- Table -->
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Santri</th>
                                    <th>Jenis Izin</th>
                                    <th>Nomor Surat</th>
                                    <th>Tujuan</th>
                                    <th>Tanggal Izin</th>
                                    <th>Tanggal Kembali</th>
                                    <th>Status</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tablePerizinan">
                                <tr>
                                    <td colspan="8" class="text-center text-muted">Tidak ada data perizinan</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Perizinan -->
    <div class="modal fade" id="modalPerizinan" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Ajukan Perizinan</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formPerizinan">
                        <input type="hidden" id="perizinanId" value="">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">Santri <span class="text-danger">*</span></label>
                                <select class="form-select" id="santri_id" required>
                                    <option value="">Pilih Santri</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Jenis Izin <span class="text-danger">*</span></label>
                                <select class="form-select" id="jenis_izin_id" required>
                                    <option value="1">Izin Pulang</option>
                                    <option value="2">Izin Sakit</option>
                                    <option value="3">Izin Keperluan Keluarga</option>
                                    <option value="4">Izin Keluar Sebentar</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Tujuan <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="tujuan" placeholder="Contoh: Rumah, RS, Pasar" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Tanggal Izin <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" id="tanggal_izin" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Tanggal Kembali <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" id="tanggal_kembali" required>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-primary" id="btnSave">
                        <i class="fas fa-paper-plane me-2"></i><span id="btnSaveText">Ajukan</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Detail Perizinan -->
    <div class="modal fade" id="modalDetailPerizinan" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Detail Perizinan</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">NIS</label>
                            <p id="detailNis" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Nama Santri</label>
                            <p id="detailNamaSantri" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Jenis Kelamin</label>
                            <p id="detailJK" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Asrama</label>
                            <p id="detailAsrama" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Kamar</label>
                            <p id="detailKamar" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Status</label>
                            <p id="detailStatusSantri" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-12">
                            <hr>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Jenis Izin</label>
                            <p id="detailJenisIzin" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Status Perizinan</label>
                            <p id="detailStatusPerizinan" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Nomor Surat</label>
                            <p id="detailNomorSurat" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">Tujuan</label>
                            <p id="detailTujuan" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Tanggal Izin</label>
                            <p id="detailTanggalIzin" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Tanggal Kembali</label>
                            <p id="detailTanggalKembali" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-12" id="catatanContainer" style="display:none;">
                            <label class="form-label fw-bold">Catatan</label>
                            <p id="detailCatatan" class="form-control-plaintext">-</p>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/perizinan.js"></script>
</body>
</html>
