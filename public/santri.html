<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Santri - Sistem Manajemen Asrama</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="sidebar"></div>

    <div class="main-content">
        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
            <div class="container-fluid">
                <button class="btn btn-link" id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <h5 class="mb-0">Data Santri</h5>
                <div class="ms-auto">
                    <div class="dropdown">
                        <button class="btn btn-link dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="fas fa-user-circle fa-lg"></i>
                            <span id="userNameNav">User</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" id="logoutBtn"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>

        <div class="container-fluid p-4">
            <div id="alertContainer"></div>

            <!-- Filter & Action -->
            <div class="filter-section">
                <div class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label">Pencarian</label>
                        <input type="text" class="form-control" id="searchInput" placeholder="Cari nama/NIS...">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Asrama</label>
                        <select class="form-select" id="filterAsrama">
                            <option value="">Semua</option>
                            <option value="1">Asrama Putra 1</option>
                            <option value="2">Asrama Putra 2</option>
                            <option value="3">Asrama Putri 1</option>
                            <option value="4">Asrama Putri 2</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Kamar</label>
                        <select class="form-select" id="filterKamar">
                            <option value="">Semua Kamar</option>
                            <option value="Umar">Umar</option>
                            <option value="Usman">Usman</option>
                            <option value="Abu Bakar">Abu Bakar</option>
                            <option value="Ali">Ali</option>
                            <option value="Aisyah">Aisyah</option>
                            <option value="Khadijah">Khadijah</option>
                            <option value="Fatimah">Fatimah</option>
                            <option value="Hafshah">Hafshah</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Status</label>
                        <select class="form-select" id="filterStatus">
                            <option value="">Semua</option>
                            <option value="aktif">Aktif</option>
                            <option value="alumni">Alumni</option>
                            <option value="keluar">Keluar</option>
                        </select>
                    </div>
                    <div class="col-md-1">
                        <label class="form-label">JK</label>
                        <select class="form-select" id="filterJK">
                            <option value="">Semua</option>
                            <option value="L">L</option>
                            <option value="P">P</option>
                        </select>
                    </div>
                    <div class="col-md-auto ms-auto">
                        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalSantri">
                            <i class="fas fa-plus me-2"></i>Tambah Santri
                        </button>
                    </div>
                </div>
            </div>

            <!-- Table -->
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>NIS</th>
                                    <th>Nama Lengkap</th>
                                    <th>JK</th>
                                    <th>Asrama</th>
                                    <th>Kamar</th>
                                    <th>Status</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tableSantri">
                                <tr>
                                    <td colspan="7" class="text-center text-muted">Tidak ada data santri</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Santri -->
    <div class="modal fade" id="modalSantri" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Tambah Santri</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formSantri">
                        <input type="hidden" id="santriId">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">NIS <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="nis" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Nama Lengkap <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="nama_lengkap" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Jenis Kelamin <span class="text-danger">*</span></label>
                                <select class="form-select" id="jenis_kelamin" required>
                                    <option value="">Pilih</option>
                                    <option value="L">Laki-laki</option>
                                    <option value="P">Perempuan</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Tanggal Lahir</label>
                                <input type="date" class="form-control" id="tanggal_lahir">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Tempat Lahir</label>
                                <input type="text" class="form-control" id="tempat_lahir">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Alamat</label>
                                <textarea class="form-control" id="alamat" rows="2"></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Asrama</label>
                                <select class="form-select" id="asrama_id">
                                    <option value="">Pilih Asrama</option>
                                    <option value="1">Asrama Putra 1</option>
                                    <option value="2">Asrama Putra 2</option>
                                    <option value="3">Asrama Putri 1</option>
                                    <option value="4">Asrama Putri 2</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Kamar</label>
                                <select class="form-select" id="kamar">
                                    <option value="">Pilih Kamar</option>
                                </select>
                                <small class="text-muted">Pilih asrama terlebih dahulu</small>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Nama Wali</label>
                                <input type="text" class="form-control" id="nama_wali">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">No. HP Wali</label>
                                <input type="text" class="form-control" id="no_hp_wali">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Alamat Wali</label>
                                <textarea class="form-control" id="alamat_wali" rows="2"></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Tanggal Masuk</label>
                                <input type="date" class="form-control" id="tanggal_masuk">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Status</label>
                                <select class="form-select" id="status">
                                    <option value="aktif">Aktif</option>
                                    <option value="alumni">Alumni</option>
                                    <option value="keluar">Keluar</option>
                                </select>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-primary" id="btnSave">
                        <i class="fas fa-save me-2"></i>Simpan
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Detail Santri -->
    <div class="modal fade" id="modalDetailSantri" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Detail Santri</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">NIS</label>
                            <p id="detailNisSantri" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Nama Lengkap</label>
                            <p id="detailNamaSantriDetail" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Jenis Kelamin</label>
                            <p id="detailJKSantri" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Tempat Lahir</label>
                            <p id="detailTempatLahir" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Tanggal Lahir</label>
                            <p id="detailTanggalLahir" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Status</label>
                            <p id="detailStatusSantriDetail" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">Alamat</label>
                            <p id="detailAlamat" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-12">
                            <hr>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Asrama</label>
                            <p id="detailAsamaDetail" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Kamar</label>
                            <p id="detailKamarDetail" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Tanggal Masuk</label>
                            <p id="detailTanggalMasuk" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-12">
                            <hr>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Nama Wali</label>
                            <p id="detailNamaWali" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">No. HP Wali</label>
                            <p id="detailNoHPWali" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">Alamat Wali</label>
                            <p id="detailAlamatWali" class="form-control-plaintext">-</p>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Inisialisasi data default jika belum ada
        if (!localStorage.getItem('dataKamar')) {
            const defaultKamar = [
                { id: 1, nama: 'Umar', asrama_id: 1, jenis: 'putra', status: 'aktif' },
                { id: 2, nama: 'Usman', asrama_id: 1, jenis: 'putra', status: 'aktif' },
                { id: 3, nama: 'Abu Bakar', asrama_id: 2, jenis: 'putra', status: 'aktif' },
                { id: 4, nama: 'Ali', asrama_id: 2, jenis: 'putra', status: 'aktif' },
                { id: 5, nama: 'Aisyah', asrama_id: 3, jenis: 'putri', status: 'aktif' },
                { id: 6, nama: 'Khadijah', asrama_id: 3, jenis: 'putri', status: 'aktif' },
                { id: 7, nama: 'Fatimah', asrama_id: 4, jenis: 'putri', status: 'aktif' },
                { id: 8, nama: 'Hafshah', asrama_id: 4, jenis: 'putri', status: 'aktif' }
            ];
            localStorage.setItem('dataKamar', JSON.stringify(defaultKamar));
        }
        
        if (!localStorage.getItem('dataAsrama')) {
            const defaultAsrama = [
                { id: 1, nama: 'Asrama Putra 1', jenis: 'putra', kapasitas: 50, alamat: 'Gedung A', status: 'aktif' },
                { id: 2, nama: 'Asrama Putra 2', jenis: 'putra', kapasitas: 50, alamat: 'Gedung B', status: 'aktif' },
                { id: 3, nama: 'Asrama Putri 1', jenis: 'putri', kapasitas: 50, alamat: 'Gedung C', status: 'aktif' },
                { id: 4, nama: 'Asrama Putri 2', jenis: 'putri', kapasitas: 50, alamat: 'Gedung D', status: 'aktif' }
            ];
            localStorage.setItem('dataAsrama', JSON.stringify(defaultAsrama));
        }
    </script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/santri.js"></script>
</body>
</html>
