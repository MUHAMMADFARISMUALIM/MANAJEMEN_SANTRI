<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Asrama & Kamar - Sistem Manajemen Asrama</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="sidebar"></div>

    <div class="main-content">
        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
            <div class="container-fluid">
                <button class="btn btn-link" id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <h5 class="mb-0">Manajemen Asrama & Kamar</h5>
                <div class="ms-auto">
                    <div class="dropdown">
                        <button class="btn btn-link dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="fas fa-user-circle fa-lg"></i>
                            <span id="userNameNav">User</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" id="logoutBtn"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>

        <div class="container-fluid p-4">
            <div id="alertContainer"></div>

            <!-- Tabs -->
            <ul class="nav nav-tabs mb-4" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="asrama-tab" data-bs-toggle="tab" data-bs-target="#asrama" type="button">
                        <i class="fas fa-building me-2"></i>Unit Asrama
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="kamar-tab" data-bs-toggle="tab" data-bs-target="#kamar" type="button">
                        <i class="fas fa-door-open me-2"></i>Daftar Kamar
                    </button>
                </li>
            </ul>

            <div class="tab-content">
                <!-- Tab Asrama -->
                <div class="tab-pane fade show active" id="asrama" role="tabpanel">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6>Daftar Unit Asrama</h6>
                        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modalAsrama">
                            <i class="fas fa-plus me-2"></i>Tambah Asrama
                        </button>
                    </div>

                    <div class="row g-3" id="asramaCards">
                        <div class="col-12 text-center text-muted">Tidak ada data asrama</div>
                    </div>
                </div>

                <!-- Tab Kamar -->
                <div class="tab-pane fade" id="kamar" role="tabpanel">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6>Daftar Kamar</h6>
                        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modalKamar">
                            <i class="fas fa-plus me-2"></i>Tambah Kamar
                        </button>
                    </div>

                    <div class="card">
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-hover">
                                    <thead>
                                        <tr>
                                            <th>Nama Kamar</th>
                                            <th>Asrama</th>
                                            <th>Jenis</th>
                                            <th>Status</th>
                                            <th>Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tableKamar">
                                        <tr>
                                            <td colspan="5" class="text-center text-muted">Tidak ada data kamar</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Asrama -->
    <div class="modal fade" id="modalAsrama" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalAsramaTitle">Tambah Unit Asrama</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formAsrama">
                        <input type="hidden" id="asrama_id">
                        <div class="mb-3">
                            <label class="form-label">Nama Asrama <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="nama_asrama" placeholder="Contoh: Asrama Putra 3" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Jenis <span class="text-danger">*</span></label>
                            <select class="form-select" id="jenis" required>
                                <option value="">Pilih Jenis</option>
                                <option value="putra">Putra</option>
                                <option value="putri">Putri</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Kapasitas</label>
                            <input type="number" class="form-control" id="kapasitas" placeholder="Contoh: 50">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Alamat/Lokasi</label>
                            <textarea class="form-control" id="alamat" rows="2" placeholder="Contoh: Gedung E"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-primary" id="btnSaveAsrama">
                        <i class="fas fa-save me-2"></i>Simpan
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Kamar -->
    <div class="modal fade" id="modalKamar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalKamarTitle">Tambah Kamar</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formKamar">
                        <input type="hidden" id="kamar_id">
                        <div class="mb-3">
                            <label class="form-label">Nama Kamar <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="nama_kamar" placeholder="Contoh: Bilal, Hamzah" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Asrama <span class="text-danger">*</span></label>
                            <select class="form-select" id="asrama_kamar" required>
                                <option value="">Pilih Asrama</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Jenis <span class="text-danger">*</span></label>
                            <select class="form-select" id="jenis_kamar" required disabled>
                                <option value="">Otomatis dari asrama</option>
                                <option value="putra">Putra</option>
                                <option value="putri">Putri</option>
                            </select>
                            <small class="text-muted">Jenis otomatis mengikuti asrama yang dipilih</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" id="status_kamar">
                                <option value="aktif">Aktif</option>
                                <option value="nonaktif">Nonaktif</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-primary" id="btnSaveKamar">
                        <i class="fas fa-save me-2"></i>Simpan
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/manajemen-asrama.js"></script>
</body>
</html>
