<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelanggaran - Sistem Manajemen Asrama</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="sidebar"></div>

    <div class="main-content">
        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
            <div class="container-fluid">
                <button class="btn btn-link" id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <h5 class="mb-0">Pelanggaran Santri</h5>
                <div class="ms-auto">
                    <div class="dropdown">
                        <button class="btn btn-link dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="fas fa-user-circle fa-lg"></i>
                            <span id="userNameNav">User</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" id="logoutBtn"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>

        <div class="container-fluid p-4">
            <div id="alertContainer"></div>

            <!-- Stats -->
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <div class="card bg-warning text-white">
                        <div class="card-body text-center">
                            <h3 id="statRingan">0</h3>
                            <p class="mb-0">Pelanggaran Ringan</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card bg-danger text-white">
                        <div class="card-body text-center">
                            <h3 id="statSedang">0</h3>
                            <p class="mb-0">Pelanggaran Sedang</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card bg-dark text-white">
                        <div class="card-body text-center">
                            <h3 id="statBerat">0</h3>
                            <p class="mb-0">Pelanggaran Berat</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Filter & Action -->
            <div class="filter-section">
                <div class="row g-3 align-items-end">
                    <div class="col-12 col-md-3">
                        <label class="form-label" for="filterPelanggaranAsrama">Asrama</label>
                        <select class="form-select" id="filterPelanggaranAsrama">
                            <option value="">Semua Asrama</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-3">
                        <label class="form-label" for="filterPelanggaranKamar">Kamar</label>
                        <select class="form-select" id="filterPelanggaranKamar">
                            <option value="">Semua Kamar</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-3">
                        <label class="form-label" for="filterPelanggaranSantri">Nama Santri</label>
                        <select class="form-select" id="filterPelanggaranSantri">
                            <option value="">Semua Santri</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-auto ms-md-auto d-flex flex-column gap-2">
                        <button class="btn btn-outline-danger" id="btnPrintRekap" type="button">
                            <i class="fas fa-file-pdf me-2"></i>Cetak Rekap PDF
                        </button>
                        <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#modalPelanggaran">
                            <i class="fas fa-plus me-2"></i>Catat Pelanggaran
                        </button>
                    </div>
                </div>
            </div>

            <!-- Table -->
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Tanggal</th>
                                    <th>Santri</th>
                                    <th>Pelanggaran</th>
                                    <th>Kategori</th>
                                    <th>Dilaporkan Oleh</th>
                                    <th>Status</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tablePelanggaran">
                                <tr>
                                    <td colspan="7" class="text-center text-muted">Tidak ada data pelanggaran</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Pelanggaran -->
    <div class="modal fade" id="modalPelanggaran" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Catat Pelanggaran</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formPelanggaran">
                        <input type="hidden" id="pelanggaranId" value="">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Santri <span class="text-danger">*</span></label>
                                <select class="form-select" id="santri_id" required>
                                    <option value="">Pilih Santri</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Jenis Pelanggaran <span class="text-danger">*</span></label>
                                <select class="form-select" id="jenis_pelanggaran_id" required>
                                    <option value="">Pilih Pelanggaran</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Tanggal Pelanggaran <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" id="tanggal_pelanggaran" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Waktu</label>
                                <input type="time" class="form-control" id="waktu_pelanggaran">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Tempat Kejadian</label>
                                <input type="text" class="form-control" id="tempat_kejadian" placeholder="Contoh: Asrama, Masjid, dll">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Catatan</label>
                                <textarea class="form-control" id="catatan" rows="2" placeholder="Catatan tambahan (opsional)"></textarea>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-danger" id="btnSave">
                        <i class="fas fa-save me-2"></i><span id="btnSaveText">Simpan</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Detail Pelanggaran -->
    <div class="modal fade" id="modalDetailPelanggaran" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Detail Pelanggaran</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">NIS</label>
                            <p id="detailNisPel" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Nama Santri</label>
                            <p id="detailNamaSantriPel" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Jenis Kelamin</label>
                            <p id="detailJKPel" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Asrama</label>
                            <p id="detailAsramaPel" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Kamar</label>
                            <p id="detailKamarPel" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Status</label>
                            <p id="detailStatusSantriPel" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-12">
                            <hr>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Pelanggaran</label>
                            <p id="detailNamaPelanggaran" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Kategori</label>
                            <p id="detailKategori" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Status Pelanggaran</label>
                            <p id="detailStatusPelanggaran" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Tanggal Pelanggaran</label>
                            <p id="detailTanggalPelanggaran" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Waktu</label>
                            <p id="detailWaktuPelanggaran" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">Tempat Kejadian</label>
                            <p id="detailTempatPelanggaran" class="form-control-plaintext">-</p>
                        </div>
                        <div class="col-12" id="catatanContainerPel" style="display:none;">
                            <label class="form-label fw-bold">Catatan</label>
                            <p id="detailCatatanPel" class="form-control-plaintext">-</p>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/pelanggaran.js"></script>
</body>
</html>
